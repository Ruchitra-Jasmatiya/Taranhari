<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Taran Hari Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E63312'/%3E%3Ctext x='50' y='68' font-size='58' font-weight='800' text-anchor='middle' fill='%23FFC20E' font-family='Arial'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{
  --red:#E63312;--red-d:#B8260B;--red-l:#FDE4DE;
  --gold:#FFC20E;--gold-d:#E0A800;--gold-l:#FFF1BD;
  --brown:#2B1608;--brown-2:#3F2411;--cream:#FFF4D6;--paper:#FBF7EC;--card:#FFFFFF;
  --line:#E9DDBF;--mute:#86704F;--ink:#2B1608;
  --ok:#1F8A44;--ok-l:#DDF3E4;--warn:#B45309;--warn-l:#FEF0CC;--err:#C62828;--err-l:#FDE2E2;--blue:#1D4ED8;--blue-l:#E0E9FF;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red-d)}
.hidden{display:none!important}
h2,h3,h4{margin:0}
.muted{color:var(--mute)}
.small{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.grow{flex:1}
.mt{margin-top:14px}.mb{margin-bottom:14px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--cream)}
.login-card{width:100%;max-width:390px;background:#fff;border:2px solid var(--brown);border-radius:20px;padding:32px 28px;box-shadow:6px 6px 0 var(--brown);text-align:center}
.logo-mark{width:64px;height:64px;margin:0 auto 10px;background:var(--red);color:var(--gold);border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:34px;border:2px solid var(--brown)}
.login-card h1{margin:4px 0 2px;font-size:23px}
.login-card p{margin:0 0 20px;color:var(--mute)}
.login-card input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;outline:none;font-size:15px;margin-bottom:12px;background:#fff}
.login-card input:focus{border-color:var(--red)}
.err{color:var(--err);font-size:13px;min-height:18px;margin:2px 0 8px}
.warnbar{background:var(--warn-l);color:var(--warn);border:1px solid #F4D58A;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;text-align:left}
.errbar{background:var(--err-l);color:var(--err);border:1px solid #F2B5B5}

/* ---------- buttons / forms ---------- */
.btn{border:2px solid var(--brown);border-radius:10px;padding:9px 15px;font-weight:700;background:var(--red);color:#fff;transition:transform .08s,box-shadow .08s;white-space:nowrap;box-shadow:2px 2px 0 var(--brown);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;font-size:13.5px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--brown)}
.btn:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--brown)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.ghost{background:#fff;color:var(--brown)}
.btn.green{background:var(--ok)}
.btn.danger{background:#fff;color:var(--err);border-color:var(--err);box-shadow:2px 2px 0 var(--err)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;box-shadow:1px 1px 0 var(--brown)}
.btn.block{width:100%}
.btn.lg{padding:13px 20px;font-size:15px}
.icon-btn{width:30px;height:30px;border:2px solid var(--line);background:#fff;border-radius:8px;display:inline-grid;place-items:center;font-weight:800;line-height:1;padding:0}
.icon-btn:hover{border-color:var(--brown)}
label.f{display:block;font-weight:700;font-size:12px;margin:0 0 5px;color:#5C4328;text-transform:uppercase;letter-spacing:.03em}
.f-in,.f-sel,.f-ta{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;outline:none;min-width:0}
.f-in:focus,.f-sel:focus,.f-ta:focus{border-color:var(--red)}
.f-ta{min-height:76px;resize:vertical}
.f-in.sm,.f-sel.sm{padding:6px 8px;font-size:13px;border-radius:8px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.row.r2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#D8CBAA;border-radius:23px;transition:.15s;cursor:pointer;border:2px solid var(--brown)}
.switch span:before{content:"";position:absolute;height:13px;width:13px;left:2px;top:2px;background:#fff;border:2px solid var(--brown);border-radius:50%;transition:.15s;box-sizing:content-box;height:11px;width:11px}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(17px)}
.chk{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
aside{background:var(--brown);color:var(--cream);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .logo-mark{width:40px;height:40px;font-size:22px;border-radius:11px;margin:0;border-color:var(--gold)}
.brand b{display:block;font-size:16px;color:#fff;line-height:1.1}
.brand small{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.navgroup{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#B79B73;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--cream);padding:9px 10px;border-radius:9px;font-weight:600;font-size:13.5px}
.nav:hover{background:var(--brown-2)}
.nav.on{background:var(--gold);color:var(--brown)}
.nav .ic{width:20px;text-align:center;font-size:15px}
.nav .count{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{width:100%}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20}
.top h2{font-size:19px}
.menu-btn{display:none}
#view{padding:22px;max-width:1280px;width:100%}
.backdrop{display:none}
@media(max-width:920px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .18s}
  aside.open{transform:none}
  aside.open+.backdrop{display:block;position:fixed;inset:0;background:rgba(43,22,8,.5);z-index:55}
  .menu-btn{display:inline-grid}
  #view{padding:14px}
  .top{padding:10px 14px}
}

/* ---------- cards / tables ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card>h3,.card-h{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h .grow{flex:1}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:#fff;border:2px solid var(--brown);border-radius:var(--r);padding:14px 16px;box-shadow:3px 3px 0 var(--brown)}
.stat .lbl{font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-size:25px;font-weight:800;margin-top:4px}
.stat .sub{font-size:12px;color:var(--mute);margin-top:2px}
.stat.red{background:var(--red);color:#fff}.stat.red .lbl,.stat.red .sub{color:#FFD9D0}
.stat.gold{background:var(--gold)}.stat.gold .lbl,.stat.gold .sub{color:#6B4F00}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.tools .f-in,.tools .f-sel{width:auto;min-width:150px}
.tools .search{flex:1;min-width:190px}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:10px 12px;background:var(--cream);border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#FFFBEA}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--cream);border:2px solid var(--line);flex:none}
.pname{display:flex;align-items:center;gap:10px;min-width:180px}
.pname b{display:block}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--cream);color:var(--brown);white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.warn{background:var(--warn-l);color:var(--warn)}.pill.err{background:var(--err-l);color:var(--err)}.pill.blue{background:var(--blue-l);color:var(--blue)}.pill.gold{background:var(--gold-l);color:#7A5A00}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:920px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:12.5px}
.tab.on{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.tab .n{opacity:.7;margin-left:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--mute);font-weight:600}.kv dd{margin:0}
.totals{margin-left:auto;max-width:330px;width:100%}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-size:18px;font-weight:800;border-top:2px solid var(--brown);margin-top:6px;padding-top:8px}
.neg{color:var(--ok)}

/* bars */
.chart{width:100%;height:190px}
.chart text{font-size:11px;fill:var(--mute);font-family:inherit}
.chart .v{fill:var(--brown);font-weight:700}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar .track{flex:1;height:10px;background:var(--cream);border-radius:9px;overflow:hidden}
.bar .fill{height:100%;background:var(--red)}

/* modal */
#modal,#confirm{position:fixed;inset:0;background:rgba(43,22,8,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
#confirm{z-index:120;align-items:center}
.mbox{background:#fff;border:2px solid var(--brown);border-radius:16px;width:100%;max-width:640px;box-shadow:6px 6px 0 var(--brown)}
.mbox.wide{max-width:880px}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:2px solid var(--line);gap:10px}
.mhead h3{flex:1;font-size:17px}
.mhead .x{border:0;background:none;font-size:26px;line-height:1;color:var(--mute);padding:0 4px}
.mbody{padding:18px}
.mfoot{padding:12px 18px;border-top:2px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--paper);border-radius:0 0 14px 14px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--brown);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;box-shadow:3px 3px 0 var(--gold);max-width:340px;border:2px solid var(--brown)}
.toast.ok{background:var(--ok);border-color:#0F5E2B}.toast.err{background:var(--err);border-color:#7F1111}

/* image field */
.imgfield{display:flex;gap:8px;align-items:center}
.imgfield img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--cream);border:2px solid var(--line);flex:none}

/* repeater */
.rep{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#FFFEF9}
.rep-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.rep-h b{flex:1;font-size:12.5px;color:var(--mute)}
.size-row{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.size-head{font-size:11px;text-transform:uppercase;color:var(--mute);font-weight:700}
@media(max-width:620px){.size-row{grid-template-columns:1fr 1fr}.size-head{display:none}}
.banner-default{background:var(--gold-l);border:2px dashed var(--gold-d);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px}

/* billing */
.pos{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:start}
@media(max-width:1100px){.pos{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pcard:hover{border-color:var(--brown)}
.pcard img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--cream)}
.pcard.out{opacity:.5}
.pcard b{font-size:13px;line-height:1.2}
.bill-line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper input{width:46px;text-align:center;padding:4px;border:2px solid var(--line);border-radius:7px}
.sticky{position:sticky;top:76px}

/* timeline */
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;gap:10px;padding:5px 0;font-size:13px}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--gold-d);margin-top:5px;flex:none;border:2px solid var(--brown)}
</style>
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="logo-mark">T</div>
    <h1>Taran Hari Admin</h1>
    <p>Sign in to manage your store</p>
    <div id="loginWarn"></div>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn block lg" id="loginBtn">Sign in</button>
  </form>
</section>

<!-- ============================== APP ============================== -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><div class="logo-mark">T</div><div><b>Taran Hari</b><small>Admin panel</small></div></div>
    <div class="navgroup">Overview</div>
    <button class="nav" data-view="dashboard"><span class="ic">&#9632;</span>Dashboard</button>
    <div class="navgroup">Sales</div>
    <button class="nav" data-view="orders"><span class="ic">&#9776;</span>Orders<span class="count hidden" id="pendingBadge">0</span></button>
    <button class="nav" data-view="billing"><span class="ic">&#9998;</span>Billing</button>
    <button class="nav" data-view="customers"><span class="ic">&#9786;</span>Customers</button>
    <div class="navgroup">Catalogue</div>
    <button class="nav" data-view="products"><span class="ic">&#9733;</span>Products</button>
    <button class="nav" data-view="stock"><span class="ic">&#9635;</span>Stock<span class="count hidden" id="stockBadge">0</span></button>
    <button class="nav" data-view="categories"><span class="ic">&#9830;</span>Categories</button>
    <div class="navgroup">Discounts</div>
    <button class="nav" data-view="coupons"><span class="ic">%</span>Coupons</button>
    <button class="nav" data-view="offers"><span class="ic">&#9733;</span>Offers &amp; sales</button>
    <div class="navgroup">Website pages</div>
    <button class="nav" data-view="p-home"><span class="ic">&#8962;</span>Home page</button>
    <button class="nav" data-view="p-shop"><span class="ic">&#9873;</span>Shop page</button>
    <button class="nav" data-view="p-contact"><span class="ic">&#9742;</span>Contact page</button>
    <div class="navgroup">Store</div>
    <button class="nav" data-view="settings"><span class="ic">&#9881;</span>Settings</button>
    <div class="side-foot">
      <a class="btn gold" href="/" target="_blank" rel="noopener">View website</a>
      <button class="btn ghost" id="logoutBtn">Log out</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
      <h2 id="title">Dashboard</h2>
      <span class="grow"></span>
      <span id="topExtra"></span>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal" class="hidden"></div>
<div id="confirm" class="hidden"></div>
<div id="toasts"></div>

<script>
'use strict';
/* ====================================================================
   Taran Hari admin panel - plain JavaScript, no build step.
   Talks to the backend under /api/admin/* using the login cookie.
   ==================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const when = (t) => new Date(t).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const dateOnly = (t) => new Date(t).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
const digitsOf = (s) => String(s || '').replace(/\D/g, '');
const STATUS = { pending: 'Pending', confirmed: 'Confirmed', packed: 'Packed', out_for_delivery: 'Out for delivery', delivered: 'Delivered', cancelled: 'Cancelled' };
const STATUS_CLS = { pending: 'warn', confirmed: 'blue', packed: 'blue', out_for_delivery: 'gold', delivered: 'ok', cancelled: 'err' };
const NEXT = { pending: 'confirmed', confirmed: 'packed', packed: 'out_for_delivery', out_for_delivery: 'delivered' };
const NEXT_LABEL = { confirmed: 'Confirm order', packed: 'Mark packed', out_for_delivery: 'Out for delivery', delivered: 'Mark delivered' };
const PAYLBL = { cod: 'Cash on delivery', cash: 'Cash', upi: 'UPI', card: 'Card', online: 'Online' };
const waLink = (phone, text) => { const d = digitsOf(phone); const n = d.length === 10 ? '91' + d : d; return `https://wa.me/${n}${text ? '?text=' + encodeURIComponent(text) : ''}`; };

let bc = null; try { bc = new BroadcastChannel('th-sync'); } catch { /* not supported */ }
async function api(method, path, body) {
  const r = await fetch('/api' + path, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'th-admin' }, body: body !== undefined ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.includes('/admin/login')) { showLogin(); throw new Error('Please log in again'); }
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  if (method !== 'GET' && bc) bc.postMessage('catalog'); // open website tabs refresh instantly
  return j;
}
function toast(msg, kind = '') {
  const d = document.createElement('div'); d.className = 'toast ' + kind; d.textContent = msg;
  $('#toasts').appendChild(d); setTimeout(() => d.remove(), 4200);
}
async function act(btn, fn, okMsg) {
  const old = btn && btn.innerHTML; if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg, 'ok'); return r; }
  catch (e) { toast(e.message, 'err'); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); const g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(0.15, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.5); o.start(); o.stop(c.currentTime + 0.5); } catch { /* no audio */ }
}
function openModal(title, body, foot, wide) {
  const m = $('#modal');
  m.innerHTML = `<div class="mbox ${wide ? 'wide' : ''}"><div class="mhead"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Close">&times;</button></div><div class="mbody">${body}</div>${foot ? `<div class="mfoot">${foot}</div>` : ''}</div>`;
  m.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  m.onmousedown = (e) => { if (e.target === m) closeModal(); };
  m.onclick = (e) => { if (e.target.closest('[data-close]')) closeModal(); };

/* ---- image upload: shrink in the browser first, then store through the API ---- */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let max = 1100; const useWebp = document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp');
      const type = file.type === 'image/gif' && file.size < 600000 ? 'image/gif' : useWebp ? 'image/webp' : 'image/jpeg';
      if (type === 'image/gif') { const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.readAsDataURL(file); return; }
      for (let q = 0.85; ; q -= 0.1) {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const d = c.toDataURL(type, q);
        if (d.length * 0.75 < 520000 || (q < 0.4 && max < 500)) { URL.revokeObjectURL(url); return resolve(d); }
        if (q < 0.45) { max *= 0.75; q = 0.95; }
      }
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}

    <label class="btn ghost sm" style="cursor:pointer"><span>Upload</span><input type="file" accept="image/*" hidden></label></div></div>`;
}
document.addEventListener('change', async (e) => {

  const box = fi.closest('[data-imgfield]'); const lab = fi.previousElementSibling; const old = lab.textContent; lab.textContent = 'Uploading…';

});

    const sizes = p.sizes.filter((s) => s.enabled !== false); const sel = B.picks[p.id] || p.weight; const s = sizes.find((x) => x.label === sel) || sizes[0];

    return `<div class="pcard ${out ? 'out' : ''}">${imgOrBlank(p.image).replace('thumb', 'thumb" style="width:100%;height:auto;aspect-ratio:1/1')}<b>${esc(p.name)}</b>

      <div class="small ${out ? '' : 'muted'}">${p.trackStock === false ? 'Not tracked' : out ? '<span class="pill err">Out of stock</span>' : s.stock + ' in stock'}</div>

  $$('[data-add]').forEach((b) => { b.onclick = () => { const p = B.products.find((x) => x.id === b.dataset.add); const size = B.picks[p.id] || p.weight; const ex = B.items.find((i) => i.id === p.id && i.size === size); if (ex) ex.qty++; else B.items.push({ id: p.id, size, qty: 1 }); requote(); }; });
}
let quoteTimer; let quoteSeq = 0;
function requote() { clearTimeout(quoteTimer); quoteTimer = setTimeout(async () => { const seq = ++quoteSeq; try { const r = await api('POST', '/admin/billing/quote', { items: B.items, coupon: B.coupon, manualDiscount: B.mVal ? { type: B.mType, value: Number(B.mVal) } : null }); if (seq === quoteSeq) { B.quote = r.quote; drawBill(); } } catch (e) { toast(e.message, 'err'); } }, 120); drawBill(); }

  $('#cq').oninput = (e) => { F.cq = e.target.value; draw(); }; draw();
};

/* ============================ WEBSITE PAGE EDITORS ============================ */
const D = {}; // working copy of the page being edited
const LISTS = {
  home: [
    { key: 'banners', title: 'Banner slideshow', help: 'Big pictures that slide automatically near the top of the Home page. Add or remove as many as you like.', item: 'Banner', fields: [['src', 'Picture', 'image'], ['alt', 'Short description', 'text']], blank: { src: '', alt: '' } },
    { key: 'blocks', title: 'Picture gallery (small blocks)', help: 'The gallery of snack pictures with a title and a little tag.', item: 'Picture', fields: [['src', 'Picture', 'image'], ['title', 'Title', 'text'], ['tag', 'Tag (e.g. Bestseller)', 'text']], blank: { src: '', title: '', tag: '' } },
    { key: 'videos', title: 'Showcase videos', help: 'Videos shown in the video section. Paste a direct video link (.mp4). Large videos cannot be uploaded here.', item: 'Video', fields: [['src', 'Video link (.mp4)', 'text'], ['title', 'Title', 'text'], ['desc', 'Description', 'area']], blank: { src: '', title: '', desc: '' } },
    { key: 'marquee', title: 'Scrolling strip words', help: 'The words that scroll across the coloured strip.', item: 'Word', strings: true, blank: '' },
    { key: 'aboutText', title: 'About us paragraphs', help: 'The story text in the About section.', item: 'Paragraph', strings: true, area: true, blank: '' },
    { key: 'team', title: 'Team / owners', help: 'People shown in the About section (founder, director, co-founder…).', item: 'Person', fields: [['photo', 'Photo', 'image'], ['name', 'Name', 'text'], ['role', 'Role', 'text'], ['text', 'About them', 'area']], blank: { photo: '', name: '', role: '', text: '' } },
    { key: 'reviews', title: 'Customer reviews', help: 'Reviews shown in the slider at the bottom of the Home page.', item: 'Review', fields: [['name', 'Customer name', 'text'], ['city', 'City', 'text'], ['stars', 'Stars (0 to 5)', 'number'], ['quote', 'Review', 'area']], blank: { name: '', city: '', stars: 5, quote: '' } },
  ],
  shop: [
    { key: 'quotes', title: 'Customer quotes', help: 'Speech-bubble quotes next to the factory video.', item: 'Quote', fields: [['text', 'What they said', 'area'], ['who', 'Who (name, city)', 'text']], blank: { text: '', who: '' } },
    { key: 'chaat', title: 'Chaat photo gallery', help: 'Mouth-watering pictures under the product list.', item: 'Photo', fields: [['src', 'Picture', 'image'], ['caption', 'Caption', 'text']], blank: { src: '', caption: '' } },
  ],
};
const SINGLES = {
  home: [['heroImage', 'Main hero picture (big plate at the top)'], ['aboutPhoto', 'About section photo']],
  shop: [['factoryPoster', 'Factory video cover picture']],
};
function repField(path, [k, label, type], val) {
  const p = `data-path="${path}|${k}"`;
  if (type === 'image') return imageField(`f-${path}-${k}`, label, val, p);
  if (type === 'area') return fld(label, `<textarea class="f-ta" ${p}>${esc(val)}</textarea>`);
  if (type === 'number') return fld(label, `<input class="f-in" type="number" min="0" max="5" step="0.5" ${p} value="${esc(val)}">`);
  return fld(label, `<input class="f-in" ${p} value="${esc(val)}">`);
}
function listCard(section, L) {
  const arr = D[section][L.key];
  const head = `<div class="card-h"><h3 class="grow">${L.title}</h3>${arr === null ? '<span class="pill gold">Using built-in default</span>' : `<span class="pill">${arr.length} item${arr.length === 1 ? '' : 's'}</span>`}</div><p class="muted" style="margin:-6px 0 12px">${L.help}</p>`;
  if (arr === null) return `<div class="card">${head}<div class="banner-default"><b>The website is showing its built-in ${L.title.toLowerCase()}.</b><div class="small muted" style="margin:4px 0 10px">Start customising to replace them with your own.</div><button class="btn" data-custom="${L.key}">Start customising</button></div></div>`;
  const items = arr.map((it, i) => `<div class="rep"><div class="rep-h"><b>${L.item} ${i + 1}</b><button class="icon-btn" data-mv="${L.key}|${i}|-1" ${i === 0 ? 'disabled' : ''}>&uarr;</button><button class="icon-btn" data-mv="${L.key}|${i}|1" ${i === arr.length - 1 ? 'disabled' : ''}>&darr;</button><button class="btn sm danger" data-rm="${L.key}|${i}">Remove</button></div>
    ${L.strings ? (L.area ? `<textarea class="f-ta" data-path="${L.key}|${i}">${esc(it)}</textarea>` : `<input class="f-in" data-path="${L.key}|${i}" value="${esc(it)}">`) : `<div class="row r2" style="margin:0">${L.fields.map((f) => repField(`${L.key}|${i}`, f, it[f[0]] ?? '')).join('')}</div>`}</div>`).join('');
  return `<div class="card">${head}${items || '<div class="empty">Nothing here yet.</div>'}<div class="tools" style="margin:6px 0 0"><button class="btn gold" data-add="${L.key}">+ Add ${L.item.toLowerCase()}</button><span class="grow"></span><button class="btn sm ghost" data-default="${L.key}">Go back to built-in default</button></div></div>`;
}
async function pageEditor(section) {
  const { content } = await api('GET', '/admin/content'); D[section] = JSON.parse(JSON.stringify(content[section]));
  const render = () => {
    const singles = (SINGLES[section] || []).length ? `<div class="card"><h3>Main pictures</h3><div class="row r2">${SINGLES[section].map(([k, l]) => imageField(`s-${k}`, l, D[section][k] || '', `data-path="${k}" placeholder="Leave empty to use the built-in picture"`)).join('')}${section === 'shop' ? fld('Factory video link (.mp4)', `<input class="f-in" data-path="factoryVideo" value="${esc(D.shop.factoryVideo || '')}" placeholder="Leave empty to use /videos/factory.mp4">`) : ''}</div></div>` : '';
    $('#view').innerHTML = `${storageWarning()}<div class="warnbar">Edit anything below, then press <b>Save changes</b>. Visitors see your changes within a few seconds.</div>${singles}${LISTS[section].map((L) => listCard(section, L)).join('')}<button class="btn lg green" id="pgSave2">Save changes</button>`;
    const save = (e) => act(e.currentTarget, async () => { const r = await api('PUT', '/admin/content/' + section, D[section]); D[section] = r.content; render(); }, 'Page saved – it is live now');
    $('#pgSave2').onclick = save; $('#topExtra').innerHTML = '<button class="btn green sm" id="pgSave">Save changes</button>'; $('#pgSave').onclick = save;
  };
  const root = $('#view');
  root.oninput = (e) => {
    const path = e.target.dataset?.path; if (!path) return; let v = e.target.value; const parts = path.split('|');
    if (parts.length === 1) D[section][parts[0]] = v.trim() ? v : null;
    else if (parts.length === 2) D[section][parts[0]][Number(parts[1])] = v;
    else D[section][parts[0]][Number(parts[1])][parts[2]] = parts[2] === 'stars' ? Number(v) : v;
  };
  root.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    const L = (key) => LISTS[section].find((x) => x.key === key);
    if (d.custom) { D[section][d.custom] = []; render(); }
    else if (d.add) { D[section][d.add].push(JSON.parse(JSON.stringify(L(d.add).blank))); render(); setTimeout(() => $$('.rep').pop()?.scrollIntoView({ block: 'center' }), 30); }
    else if (d.rm) { const [k, i] = d.rm.split('|'); D[section][k].splice(Number(i), 1); render(); }
    else if (d.mv) { const [k, i, dir] = d.mv.split('|'); const a = D[section][k]; const x = Number(i); const y = x + Number(dir); [a[x], a[y]] = [a[y], a[x]]; render(); }
    else if (d.default) { confirmBox('Remove your changes and go back to the website\'s built-in version?', 'Go back', false).then((ok) => { if (ok) { D[section][d.default] = null; render(); } }); }
  };
  render();
}
VIEWS['p-home'] = () => pageEditor('home');
VIEWS['p-shop'] = () => pageEditor('shop');
VIEWS['p-contact'] = async () => {
  const { content } = await api('GET', '/admin/content'); const c = content.contact;
  $('#view').innerHTML = `${storageWarning()}<div class="warnbar">These details are used on the Contact page, the top bar and the footer of your website.</div>
  <div class="card"><h3>Owner</h3><div class="row r2">${fld('Owner name', `<input class="f-in" id="c-ownerName" value="${esc(c.ownerName)}">`)}${fld('Role / title', `<input class="f-in" id="c-ownerRole" value="${esc(c.ownerRole)}">`)}</div>${imageField('ownerPhoto', 'Owner photo', c.ownerPhoto, 'id="c-ownerPhoto"')}<div style="height:14px"></div>${fld('Short message from the owner', `<textarea class="f-ta" id="c-ownerBio">${esc(c.ownerBio)}</textarea>`)}</div>
  <div class="card"><h3>Phone, WhatsApp &amp; email</h3><div class="row r2">${fld('Phone (as shown)', `<input class="f-in" id="c-phoneDisplay" value="${esc(c.phoneDisplay)}" placeholder="+91 98765 43210">`)}${fld('Phone (for the Call button)', `<input class="f-in" id="c-phoneTel" value="${esc(c.phoneTel)}" placeholder="+919876543210">`, 'With country code, no spaces')}${fld('WhatsApp number', `<input class="f-in" id="c-whatsapp" value="${esc(c.whatsapp)}" placeholder="919876543210">`, 'Country code + number, digits only')}${fld('Email', `<input class="f-in" id="c-email" value="${esc(c.email)}" placeholder="hello@taranhari.com">`)}</div>${fld('Ready-made WhatsApp message', `<input class="f-in" id="c-whatsappMessage" value="${esc(c.whatsappMessage)}">`, 'What the customer\'s message starts with when they tap WhatsApp')}</div>
  <div class="card"><h3>Social media</h3><div class="row r2">${fld('Instagram link', `<input class="f-in" id="c-instagram" value="${esc(c.instagram)}" placeholder="https://www.instagram.com/yourpage">`)}${fld('Facebook link', `<input class="f-in" id="c-facebook" value="${esc(c.facebook)}">`)}${fld('YouTube link', `<input class="f-in" id="c-youtube" value="${esc(c.youtube)}">`)}</div></div>
  <div class="card"><h3>Factory address &amp; hours</h3><div class="row r2">${fld('Short address (footer)', `<input class="f-in" id="c-addressShort" value="${esc(c.addressShort)}" placeholder="Nagpur, Maharashtra">`)}${fld('Opening hours', `<input class="f-in" id="c-hours" value="${esc(c.hours)}">`)}</div>${fld('Full address', `<textarea class="f-ta" id="c-addressFull">${esc(c.addressFull)}</textarea>`)}<div style="height:12px"></div>${fld('Google Maps link', `<input class="f-in" id="c-mapUrl" value="${esc(c.mapUrl)}" placeholder="https://maps.google.com/…">`, 'Open your location in Google Maps, tap Share, and paste the link here')}</div>
  <button class="btn lg green" id="ctSave">Save changes</button>`;
  const keys = ['ownerName', 'ownerRole', 'ownerPhoto', 'ownerBio', 'phoneDisplay', 'phoneTel', 'whatsapp', 'email', 'whatsappMessage', 'instagram', 'facebook', 'youtube', 'addressShort', 'hours', 'addressFull', 'mapUrl'];
  const save = (e) => act(e.currentTarget, () => api('PUT', '/admin/content/contact', Object.fromEntries(keys.map((k) => [k, $('#c-' + k).value]))), 'Contact details saved – live now');
  $('#ctSave').onclick = save; $('#topExtra').innerHTML = '<button class="btn green sm" id="ctSave2">Save changes</button>'; $('#ctSave2').onclick = save;
};

/* ================================== SETTINGS ================================== */
VIEWS.settings = async () => {
  const { settings: s, storage } = await api('GET', '/admin/settings'); S.storage = storage; const inv = s.invoice || {};
  $('#view').innerHTML = `${storageWarning()}${passWarning()}
  <div class="card"><h3>Store</h3><div class="row r2">${fld('Store name', `<input class="f-in" id="s-shopName" value="${esc(s.shopName)}">`)}${fld('Tagline', `<input class="f-in" id="s-tagline" value="${esc(s.tagline)}">`)}</div>${fld('Announcement bar message', `<input class="f-in" id="s-announcement" value="${esc(s.announcement)}" placeholder="e.g. Diwali sale: extra 10% off!">`, 'Leave empty to hide it')}
  <div class="row mt"><label class="chk">${sw(s.acceptingOrders !== false, 'id="s-accepting"')} Accepting website orders <span class="muted small">(turn off when you are closed)</span></label></div></div>
  <div class="card"><h3>Delivery &amp; discounts</h3><div class="row">${fld('Delivery fee ₹', `<input class="f-in" id="s-deliveryFee" type="number" min="0" value="${esc(s.deliveryFee)}">`)}${fld('Free delivery above ₹', `<input class="f-in" id="s-free" type="number" min="0" value="${esc(s.freeDeliveryAbove)}">`, 'Measured after discounts')}${fld('Minimum order ₹', `<input class="f-in" id="s-minOrder" type="number" min="0" value="${esc(s.minOrder)}">`)}</div>
  <label class="chk">${sw(s.allowStacking !== false, 'id="s-stack"')} Allow a coupon and an automatic offer on the same order <span class="muted small">(off = customer gets whichever saves more)</span></label></div>
  <div class="card"><h3>Bill &amp; invoice details</h3><p class="muted" style="margin:-6px 0 12px">Printed at the top of every bill and invoice.</p><div class="row r2">${fld('Business name', `<input class="f-in" id="i-businessName" value="${esc(inv.businessName)}">`)}${fld('Phone', `<input class="f-in" id="i-phone" value="${esc(inv.phone)}">`)}${fld('Email', `<input class="f-in" id="i-email" value="${esc(inv.email)}">`)}${fld('GSTIN (optional)', `<input class="f-in" id="i-gstin" value="${esc(inv.gstin)}">`)}${fld('UPI ID (printed on unpaid bills)', `<input class="f-in" id="i-upiId" value="${esc(inv.upiId)}" placeholder="name@bank">`)}${fld('GST % included in prices', `<input class="f-in" id="s-gst" type="number" min="0" max="100" step="0.5" value="${esc(s.gstPercent)}">`, '0 = do not show GST. Prices already include it.')}</div>${fld('Address', `<textarea class="f-ta" id="i-address">${esc(inv.address)}</textarea>`)}<div style="height:12px"></div>${fld('Footer note', `<input class="f-in" id="i-footerNote" value="${esc(inv.footerNote)}">`)}</div>
  <button class="btn lg green" id="sSave">Save settings</button>
  <div class="card mt"><h3>Change admin password</h3><div class="row">${fld('Current password', '<input class="f-in" id="pw-cur" type="password" autocomplete="current-password">')}${fld('New password (min 8 characters)', '<input class="f-in" id="pw-new" type="password" autocomplete="new-password">')}${fld('Repeat new password', '<input class="f-in" id="pw-new2" type="password" autocomplete="new-password">')}</div><button class="btn" id="pwSave">Change password</button><div class="hint">If you ever forget it, set <code>ADMIN_FORCE_ENV_PASSWORD=true</code> in Vercel and sign in with <code>ADMIN_PASSWORD</code>.</div></div>
  <div class="card"><h3>Security activity</h3><p class="muted" style="margin:-6px 0 12px">Recent sign-ins, wrong passwords and blocked bots. If you see sign-ins you do not recognise, change your password straight away.</p><div id="actList" class="small muted">Loading\u2026</div></div>
  <div class="card"><h3>Backup &amp; data</h3><p class="muted" style="margin:-6px 0 12px">Download a backup regularly. It contains products, categories, orders, coupons, page content and uploaded pictures.</p><div class="tools"><a class="btn" href="/api/admin/export" download>Download backup</a><label class="btn ghost" style="cursor:pointer">Restore from file<input type="file" id="imp" accept="application/json" hidden></label><button class="btn ghost" id="cleanImgs">Delete unused pictures</button><button class="btn danger" id="reset">Restore sample data</button></div></div>`;
  api('GET', '/admin/activity').then((r) => {
    const kinds = { login: ['ok', 'Sign-in'], security: ['warn', 'Security'], blocked: ['err', 'Blocked'] };
    $('#actList').innerHTML = r.activity.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>Type</th><th>What happened</th><th>Device (IP)</th></tr></thead><tbody>${r.activity.slice(0, 40).map((e) => { const k = kinds[e.kind] || ['', e.kind]; return `<tr><td class="nowrap">${when(e.ts)}</td><td><span class="pill ${k[0]}">${k[1]}</span></td><td>${esc(e.text)}</td><td class="small muted">${esc(e.ip || '')}</td></tr>`; }).join('')}</tbody></table></div>` : 'Nothing recorded yet.';
  }).catch(() => { $('#actList').textContent = 'Could not load activity.'; });
  $('#sSave').onclick = (e) => act(e.currentTarget, () => api('PUT', '/admin/settings', {
    shopName: $('#s-shopName').value, tagline: $('#s-tagline').value, announcement: $('#s-announcement').value, acceptingOrders: $('#s-accepting').checked,
    deliveryFee: $('#s-deliveryFee').value, freeDeliveryAbove: $('#s-free').value, minOrder: $('#s-minOrder').value, allowStacking: $('#s-stack').checked, gstPercent: $('#s-gst').value,
    invoice: { businessName: $('#i-businessName').value, phone: $('#i-phone').value, email: $('#i-email').value, gstin: $('#i-gstin').value, upiId: $('#i-upiId').value, address: $('#i-address').value, footerNote: $('#i-footerNote').value },
  }), 'Settings saved');
  $('#pwSave').onclick = (e) => { if ($('#pw-new').value !== $('#pw-new2').value) return toast('The new passwords do not match', 'err'); act(e.currentTarget, async () => { await api('POST', '/admin/password', { current: $('#pw-cur').value, next: $('#pw-new').value }); S.defaultPw = false; ['#pw-cur', '#pw-new', '#pw-new2'].forEach((x) => { $(x).value = ''; }); }, 'Password changed'); };
  $('#imp').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; if (!(await confirmBox('Restore this backup? Everything currently in the store will be replaced.', 'Restore'))) return; let j; try { j = JSON.parse(await f.text()); } catch { return toast('That file is not a valid backup', 'err'); } act(null, async () => { await api('POST', '/admin/import', j); VIEWS.settings(); }, 'Backup restored'); };
  $('#cleanImgs').onclick = (e) => act(e.currentTarget, async () => { const r = await api('POST', '/admin/images/cleanup', {}); toast(`${r.removed} unused picture${r.removed === 1 ? '' : 's'} deleted`, 'ok'); });
  $('#reset').onclick = () => { const m = openModal('Restore sample data', '<p>This <b>deletes all products, orders, coupons and page changes</b> and loads the original sample catalogue. Your password stays the same.</p><label class="f">Type RESET to confirm</label><input class="f-in" id="rs">', '<button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="rsGo">Restore sample data</button>'); $('#rsGo', m).onclick = (e) => act(e.currentTarget, async () => { await api('POST', '/admin/reset', { confirm: $('#rs').value }); closeModal(); VIEWS.settings(); }, 'Sample data restored'); };
};

boot();
